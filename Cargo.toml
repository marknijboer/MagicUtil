[package]
name = "magicutil"
version = "0.1.12"
authors = ["Mark Nijboer <mark+magicutil@nijboer.email>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "magicutil"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.release]
codegen-units = 1
opt-level = 'z'
lto = true
debug-assertions = false
debug = false
rpath = false
panic = "abort"
strip = true

[dependencies]
libc = "0.2.171"
md5 = "0.7.0"
mac_address = "1.1.8"
simple-error = "0.3.1"
local_ipaddress = "0.1.3"
clap = { version = "4.4.11", features = ["cargo"] }
lazy_static = "1.5.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
aes = "0.8.4"
base64 = "0.22.1"
pwhash = "1"
pad = "0.1.6"
colored = "2.1.0"
ansi_term = "0.12.1"
regex = "1.11.1"
